<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Report</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column;
       font: 14px system-ui, sans-serif; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
         background: #1c2128; color: #dfe3ea; }
.brand { font-weight: 600; letter-spacing: .3px; margin-right: 10px; }
header select, header button { font: inherit; padding: 5px 12px;
  background: #2c3340; color: #dfe3ea; border: 1px solid #3a4250;
  border-radius: 4px; cursor: pointer; }
header button:hover { background: #384050; }
.grow { flex: 1; }
#status { color: #8fa3c0; font-size: 13px; }
#copy { background: #2d6cdf; border-color: #2d6cdf; color: #fff;
        padding: 6px 18px; font-weight: 600; }
#copy:hover { background: #245bc0; }
main { flex: 1; display: flex; min-height: 0; }
#outline { width: 190px; background: #f7f8fa; border-right: 1px solid #dfe3e8;
           overflow-y: auto; padding: 4px 0 8px; }
.ohead { font-size: 10.5px; font-weight: 700; letter-spacing: 1px;
         color: #7a8699; text-transform: uppercase; padding: 8px 12px 4px; }
.oitem { display: flex; align-items: center; gap: 3px; padding: 4px 8px 4px 12px;
         font-size: 12.5px; border-radius: 4px; margin: 0 4px; }
.oitem:hover { background: #eceef2; }
.oitem span { flex: 1; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; cursor: pointer; color: #2a3342; }
.oitem span:hover { color: #2d6cdf; }
.oitem button { border: 1px solid #d3d8df; background: #fff; border-radius: 3px;
                cursor: pointer; padding: 0 5px; font-size: 11px; color: #4a5568; }
.oitem button:hover { border-color: #2d6cdf; color: #2d6cdf; }
.oitem button:disabled { opacity: .3; cursor: default; }
#editor { flex: 1; border: none; outline: none; resize: none; padding: 16px;
          font: 13px/1.55 Consolas, monospace; background: #fdfdfd;
          color: #24292f; }
#preview { flex: 1; border: none; border-left: 1px solid #dfe3e8;
           background: #eef1f5; }
#gate { position: fixed; inset: 0; background: #eef1f5; display: flex;
        align-items: center; justify-content: center; z-index: 10; }
#histview { position: fixed; inset: 0; background: #eef1f5; z-index: 20;
            display: none; flex-direction: column; }
#histview.open { display: flex; }
.hv-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
           background: #1c2128; color: #dfe3ea; }
.hv-head button { font: inherit; padding: 5px 12px; background: #2c3340;
  color: #dfe3ea; border: 1px solid #3a4250; border-radius: 4px;
  cursor: pointer; }
.hv-head button:hover { background: #384050; }
#hv-meta { color: #8fa3c0; font-size: 13px; }
.hv-body { flex: 1; overflow-y: auto; padding: 20px; }
.hv-card { max-width: 900px; margin: 0 auto 16px; background: #fff;
           border: 1px solid #dce0e6; border-radius: 8px; padding: 18px 24px; }
.hv-card h2 { font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
              color: #7a8699; margin: 0 0 12px; }
table.hsum { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.hsum th { text-align: left; font-size: 11px; letter-spacing: 1px;
           color: #7a8699; text-transform: uppercase; padding: 6px 8px;
           border-bottom: 1px solid #e3e6ea; font-weight: 600; }
.hsum th.num, .hsum td.num { text-align: right; white-space: nowrap; }
.hsum td { padding: 7px 8px; border-bottom: 1px solid #eef0f3;
           color: #24292f; }
.hsum tbody tr { cursor: pointer; }
.hsum tbody tr:hover td, .hsum tr.sel td { background: #f3f6fb; }
.hsum td.hname { font-weight: 600; color: #1f3864; }
.track { background: #eef1f5; border-radius: 4px; height: 10px;
         min-width: 120px; }
.meter { background: #1f3864; height: 10px; border-radius: 0 4px 4px 0; }
.tlentry { border-left: 3px solid #e3e6ea; margin: 0 0 14px;
           padding: 2px 0 2px 14px; }
.tlweek { font-weight: 600; color: #1f3864; font-size: 13.5px; }
.tldays { color: #7a8699; font-size: 12px; margin-left: 8px; }
.tlmd { font-size: 13.5px; color: #24292f; }
.tlmd p { margin: 4px 0; }
.tlmd ul { margin: 6px 0; padding-left: 20px; }
.tlmd li { margin: 2px 0; }
.tlnone { color: #8a94a6; font-style: italic; font-size: 13px; }
.gate-card { background: #fff; border: 1px solid #dce0e6; border-radius: 8px;
             padding: 34px 40px; text-align: center; max-width: 440px; }
.gate-card h1 { font-size: 18px; margin: 0 0 8px; color: #1f3864; }
.gate-card p { color: #5a6472; font-size: 13.5px; line-height: 1.5;
               margin: 0 0 18px; }
.gate-card button { font: inherit; padding: 9px 22px; border-radius: 5px;
  border: 1px solid #2d6cdf; background: #2d6cdf; color: #fff; cursor: pointer;
  font-weight: 600; margin: 0 4px; }
.gate-card button.alt { background: #fff; color: #2d6cdf; }
.gate-card .err { color: #b00020; font-size: 12.5px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <span class="brand">Weekly Report</span>
  <select id="file"></select>
  <button id="new">New week</button>
  <button id="history">History</button>
  <button id="folder" title="Switch reports folder">Folder…</button>
  <span id="status"></span>
  <span class="grow"></span>
  <button id="copy">Copy email</button>
</header>
<main>
  <aside id="outline"
         title="Project order — arrows move, Alt+Up/Down in the editor">
    <div class="ohead">Projects</div>
    <div id="olist"></div>
  </aside>
  <textarea id="editor" spellcheck="false"></textarea>
  <iframe id="preview"></iframe>
</main>
<div id="histview">
  <div class="hv-head">
    <span class="brand">History</span>
    <span id="hv-meta"></span>
    <span class="grow"></span>
    <button id="hv-close">Close</button>
  </div>
  <div class="hv-body">
    <div class="hv-card">
      <h2>Days per project</h2>
      <table class="hsum">
        <thead><tr><th>Project</th><th class="num">Weeks</th>
        <th class="num">Days</th><th class="num">Share</th><th></th></tr></thead>
        <tbody id="hsum-body"></tbody>
      </table>
    </div>
    <div class="hv-card">
      <h2 id="tl-title">Timeline</h2>
      <div id="histtl"></div>
    </div>
  </div>
</div>
<div id="gate">
  <div class="gate-card">
    <h1>Weekly Report</h1>
    <p>Pick your <b>weekly-reports</b> folder to start. Reports are read and
       saved directly on your disk — nothing is uploaded anywhere.
       Requires Chrome or Edge.</p>
    <button id="open-folder">Open folder…</button>
    <button id="reopen-folder" class="alt" hidden>Reopen last folder</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>
<script src="vendor/marked-14.min.js"></script>
<script src="vendor/highlight-11.min.js"></script>
<script src="app.js"></script>
</body>
</html>
